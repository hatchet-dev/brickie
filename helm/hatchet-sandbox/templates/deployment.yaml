{{- if not (or .Values.hatchet.token .Values.hatchet.existingSecret) }}
{{- fail "HATCHET_CLIENT_TOKEN is required: set hatchet.token or hatchet.existingSecret (a Secret containing the HATCHET_CLIENT_TOKEN key)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hatchet-sandbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hatchet-sandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hatchet-sandbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hatchet-sandbox.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hatchet-sandbox.fullname" . }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BRICKIE_SANDBOX_NAMESPACE
              value: {{ include "hatchet-sandbox.sandboxNamespace" . | quote }}
            - name: BRICKIE_SANDBOX_IMAGE
              value: {{ .Values.sandbox.image | quote }}
            - name: BRICKIE_TURN_TIMEOUT
              value: {{ .Values.sandbox.turnTimeout | quote }}
            - name: BRICKIE_CREDENTIALS
              value: {{ include "hatchet-sandbox.credentialNames" . | quote }}
          envFrom:
            {{- if or .Values.hatchet.token .Values.sandbox.credentials }}
            - secretRef:
                name: {{ include "hatchet-sandbox.fullname" . }}
            {{- end }}
            {{- if .Values.hatchet.existingSecret }}
            - secretRef:
                name: {{ .Values.hatchet.existingSecret }}
            {{- end }}
            {{- if .Values.sandbox.existingCredentialsSecret }}
            - secretRef:
                name: {{ .Values.sandbox.existingCredentialsSecret }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
