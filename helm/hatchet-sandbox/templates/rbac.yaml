apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hatchet-sandbox.fullname" . }}
  namespace: {{ include "hatchet-sandbox.sandboxNamespace" . }}
  labels:
    {{- include "hatchet-sandbox.labels" . | nindent 4 }}
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hatchet-sandbox.fullname" . }}
  namespace: {{ include "hatchet-sandbox.sandboxNamespace" . }}
  labels:
    {{- include "hatchet-sandbox.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hatchet-sandbox.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hatchet-sandbox.fullname" . }}
    namespace: {{ .Release.Namespace }}
