{{- if or .Values.hatchet.token .Values.sandbox.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hatchet-sandbox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hatchet-sandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.hatchet.token }}
  HATCHET_CLIENT_TOKEN: {{ .Values.hatchet.token | quote }}
  {{- end }}
  {{- range $name, $value := .Values.sandbox.credentials }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
