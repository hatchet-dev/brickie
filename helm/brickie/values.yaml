replicaCount: 1
slots: 10

image:
  repository: brickie-worker
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

hatchet:
  token: ""
  existingSecret: ""

sandbox:
  namespace: ""
  image: alpine:3
  turnTimeout: 15m
  idleTTL: 30m
  runtime: auto
  credentials: {}
  existingCredentialsSecret: ""
  credentialNames: []
  warmImages: []
  warmReplicas: 2

objectStore: ""
objectStoreSecret: ""

injector:
  enabled: false
  secret: ""
  image: ""
  catalog: {}

csi:
  enabled: false
  dataDir: /var/lib/brickie
  objectStore: ""

resources: {}
nodeSelector: {}
tolerations: []

agent-sandbox:
  enabled: true
  image:
    tag: v1.0.3
  controller:
    extensions: true
