apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxsessions.brickie.hatchet.run
spec:
  group: brickie.hatchet.run
  names:
    kind: SandboxSession
    listKind: SandboxSessionList
    plural: sandboxsessions
    singular: sandboxsession
    shortNames: ["sbxs"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Snapshot
          type: string
          jsonPath: .status.lastSnapshotId
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                fromSnapshot:
                  type: string
                ttlSeconds:
                  type: integer
                  format: int64
            status:
              type: object
              properties:
                phase:
                  type: string
                sandboxName:
                  type: string
                lastSnapshotId:
                  type: string
