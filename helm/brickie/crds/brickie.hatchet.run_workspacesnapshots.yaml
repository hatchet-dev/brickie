apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspacesnapshots.brickie.hatchet.run
spec:
  group: brickie.hatchet.run
  names:
    kind: WorkspaceSnapshot
    listKind: WorkspaceSnapshotList
    plural: workspacesnapshots
    singular: workspacesnapshot
    shortNames: ["wsnap"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Size
          type: integer
          jsonPath: .status.sizeBytes
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                sessionRef:
                  type: string
                turnRunId:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                sizeBytes:
                  type: integer
                  format: int64
                location:
                  type: string
