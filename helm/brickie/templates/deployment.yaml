{{- if not (or .Values.hatchet.token .Values.hatchet.existingSecret) }}
{{- fail "HATCHET_CLIENT_TOKEN is required: set hatchet.token or hatchet.existingSecret (a Secret containing the HATCHET_CLIENT_TOKEN key)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brickie.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "brickie.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "brickie.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brickie.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "brickie.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: BRICKIE_SANDBOX_NAMESPACE
              value: {{ include "brickie.sandboxNamespace" . | quote }}
            - name: BRICKIE_SANDBOX_IMAGE
              value: {{ .Values.sandbox.image | quote }}
            - name: BRICKIE_TURN_TIMEOUT
              value: {{ .Values.sandbox.turnTimeout | quote }}
            - name: BRICKIE_CREDENTIALS
              value: {{ include "brickie.credentialNames" . | quote }}
            {{- if .Values.objectStore }}
            - name: BRICKIE_OBJECT_STORE
              value: {{ .Values.objectStore | quote }}
            {{- end }}
            {{- if .Values.csi.enabled }}
            - name: BRICKIE_OVERLAY
              value: "true"
            {{- end }}
            - name: BRICKIE_GVISOR
              value: {{ .Values.gvisor.mode | quote }}
            {{- if .Values.injector.enabled }}
            {{- if not .Values.injector.secret }}
            {{- fail "injector.secret is required when injector.enabled: a Secret with BRICKIE_INJECTOR_PUBLIC_KEY and BRICKIE_INJECTOR_PRIVATE_KEY (run `brickie injector keygen`)" }}
            {{- end }}
            - name: BRICKIE_INJECTOR
              value: "true"
            - name: BRICKIE_INJECTOR_SECRET
              value: {{ .Values.injector.secret | quote }}
            - name: BRICKIE_INJECTOR_IMAGE
              value: {{ .Values.injector.image | default (printf "%s:%s" .Values.image.repository .Values.image.tag) | quote }}
            - name: BRICKIE_INJECTOR_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.injector.secret }}
                  key: BRICKIE_INJECTOR_PUBLIC_KEY
            {{- if .Values.injector.catalog }}
            - name: BRICKIE_INJECTOR_CATALOG
              value: {{ .Values.injector.catalog | toJson | quote }}
            {{- end }}
            {{- end }}
            - name: BRICKIE_SLOTS
              value: {{ .Values.slots | quote }}
          envFrom:
            {{- if or .Values.hatchet.token .Values.sandbox.credentials }}
            - secretRef:
                name: {{ include "brickie.fullname" . }}
            {{- end }}
            {{- if .Values.hatchet.existingSecret }}
            - secretRef:
                name: {{ .Values.hatchet.existingSecret }}
            {{- end }}
            {{- if .Values.sandbox.existingCredentialsSecret }}
            - secretRef:
                name: {{ .Values.sandbox.existingCredentialsSecret }}
            {{- end }}
            {{- if .Values.objectStoreSecret }}
            - secretRef:
                name: {{ .Values.objectStoreSecret }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
