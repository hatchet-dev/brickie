[project]
name = "brickie"
version = "0.1.0"
description = "Sandboxes for agents, orchestrated by Hatchet"
requires-python = ">=3.10"
dependencies = [
  "hatchet-sdk>=1.29",
  "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hatchet_sandbox"]
