apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: brickie-template
  namespace: default
spec:
  podTemplate:
    spec:
      containers:
        - name: runtime
          image: sandbox-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
  networkPolicy:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: default
            podSelector:
              matchLabels:
                app.kubernetes.io/name: sandbox-router
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: brickie-pool
  namespace: default
spec:
  replicas: 1
  sandboxTemplateRef:
    name: brickie-template
