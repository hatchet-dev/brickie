name: sdk-typescript

on:
  pull_request:
    paths:
      - ".github/workflows/sdk-typescript.yaml"
      - "sdks/typescript/**"
      - "examples/typescript/**"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "sdks/typescript/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: sdk-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter ./sdks/typescript build
      - name: The SDK version has a changelog section
        run: hack/changelog-notes.sh sdks/typescript/CHANGELOG.md "$(node -p 'require("./sdks/typescript/package.json").version')" >/dev/null

  publish:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish when the version is new
        working-directory: sdks/typescript
        run: |
          version=$(node -p 'require("./package.json").version')
          published=$(pnpm view @hatchet-dev/sandbox version 2>/dev/null || true)
          if [ "$version" = "$published" ]; then
            echo "@hatchet-dev/sandbox@${version} is already on npm; nothing to publish"
          else
            pnpm build
            pnpm publish --no-git-checks
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release when missing
        run: |
          if gh release view "ts/${VERSION}" >/dev/null 2>&1; then
            echo "release ts/${VERSION} exists"
            exit 0
          fi
          hack/changelog-notes.sh sdks/typescript/CHANGELOG.md "$VERSION" > "${RUNNER_TEMP}/notes.md"
          gh release create "ts/${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "TypeScript SDK ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
