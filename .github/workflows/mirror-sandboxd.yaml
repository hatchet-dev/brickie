name: mirror-sandboxd

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: [internal/sandboxd/sandboxd.go]

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy the pinned upstream digest into ghcr.io/hatchet-dev/sandboxd
        run: |
          digest=$(sed -n 's/^\tdigest *= *"\(sha256:[0-9a-f]*\)"$/\1/p' internal/sandboxd/sandboxd.go)
          [ -n "$digest" ] || { echo "::error::no digest in internal/sandboxd/sandboxd.go"; exit 1; }
          upstream="us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd@$digest"
          mirror="ghcr.io/hatchet-dev/sandboxd"
          if docker buildx imagetools inspect "$mirror@$digest" >/dev/null 2>&1; then
            echo "$mirror@$digest is already there"
            exit 0
          fi
          docker buildx imagetools create --tag "$mirror:${digest#sha256:}" "$upstream"
          docker buildx imagetools inspect "$mirror@$digest" >/dev/null
