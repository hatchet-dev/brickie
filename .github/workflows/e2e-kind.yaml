name: e2e-kind

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-kind.yaml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "sdks/typescript/**"
      - "examples/typescript/**"
      - "pnpm-lock.yaml"
      - "hack/e2e-kind.sh"
      - "hack/e2e-kind/**"
      - "docker-compose.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    uses: ./.github/workflows/mirror-sandboxd.yaml
    permissions:
      contents: read
      packages: write
  demos:
    needs: mirror
    runs-on: ubicloud-standard-8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          install_only: true
      - run: pnpm install --frozen-lockfile
      - name: Both demos on the Kubernetes driver
        run: hack/e2e-kind.sh
        env:
          BRICKIE_HATCHET_BIND: 0.0.0.0
      - name: Cluster state
        if: failure()
        run: |
          kubectl -n brickie get pods,sandboxclaims,sandboxwarmpools -o wide || true
          kubectl -n brickie describe pods || true
          kubectl -n brickie logs deployment/brickie --tail=200 || true
