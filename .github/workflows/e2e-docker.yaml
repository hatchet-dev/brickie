name: e2e-docker

on:
  pull_request:
    paths:
      - ".github/workflows/e2e-docker.yaml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "sdks/typescript/**"
      - "examples/typescript/**"
      - "pnpm-lock.yaml"
      - "hack/run-demo.sh"
      - "docker-compose.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: CGO_ENABLED=0 go build -o bin/brickie ./cmd/brickie
      - name: File demo on the Docker driver
        run: hack/run-demo.sh fs
        env:
          BRICKIE_YES: "1"
      - name: Agent-session demo on the Docker driver
        run: hack/run-demo.sh
        env:
          BRICKIE_YES: "1"
      - name: Provider log
        if: always()
        run: cat ~/.brickie/provider.log || true
