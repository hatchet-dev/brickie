name: fips-images

on:
  workflow_dispatch:
    inputs:
      agent_sandbox_version:
        description: "agent-sandbox release tag; default: latest and the go.mod pin"
        required: false
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [.github/workflows/fips-images.yaml, .github/actions/sign-image/action.yml, hack/agent-sandbox-fips.Dockerfile, hack/check-fips.sh, go.mod]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  versions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          AS_INPUT: ${{ inputs.agent_sandbox_version }}
        run: |
          set -euo pipefail
          versions="${AS_INPUT:-$(gh release view --repo kubernetes-sigs/agent-sandbox --json tagName --jq .tagName) $(go list -m -f '{{.Version}}' sigs.k8s.io/agent-sandbox)}"
          echo "versions=$(tr ' ' '\n' <<< "$versions" | sort -u | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  publish:
    needs: versions
    runs-on: ubicloud-standard-8
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
        image: [agent-sandbox-controller, sandboxd]
    env:
      TAG: ghcr.io/hatchet-dev/${{ matrix.image }}:${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: have
        run: docker buildx imagetools inspect "$TAG" >/dev/null 2>&1 && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.have.outputs.yes == 'false'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.have.outputs.yes == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.have.outputs.yes == 'false'
        id: build
        run: |
          set -euo pipefail
          target=${{ matrix.image == 'agent-sandbox-controller' && 'controller' || 'sandboxd' }}
          docker buildx build --platform linux/amd64,linux/arm64 --target "$target" --build-arg "VERSION=${{ matrix.version }}" \
            --output "type=image,name=${TAG%:*},push=true,push-by-digest=true,name-canonical=true" \
            --metadata-file "$RUNNER_TEMP/meta.json" -f hack/agent-sandbox-fips.Dockerfile hack
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")" >> "$GITHUB_OUTPUT"
      - if: steps.have.outputs.yes == 'false'
        uses: ./.github/actions/sign-image
        with:
          images: ghcr.io/hatchet-dev/${{ matrix.image }}@${{ steps.build.outputs.digest }}
      - if: steps.have.outputs.yes == 'false'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$TAG" "${TAG%:*}@$DIGEST"
          [ "$(docker buildx imagetools inspect "$TAG" --format '{{.Manifest.Digest}}')" = "$DIGEST" ]
