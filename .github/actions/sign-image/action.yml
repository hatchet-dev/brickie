name: Sign image
description: Syft SPDX SBOM attestation on each platform manifest of a pushed image, then a keyless cosign signature on the image, so a signature means the SBOMs are there
inputs:
  images:
    description: Pushed image references, one per line
    required: true
  sbom:
    description: Attach an SBOM attestation to every platform manifest
    default: "true"
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - if: inputs.sbom == 'true'
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        SBOM: ${{ inputs.sbom }}
      run: |
        set -euo pipefail
        identity=(--certificate-oidc-issuer https://token.actions.githubusercontent.com
                  --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\.github/workflows/[^@]+@$GITHUB_REF\$")
        while read -r image; do
          [ -n "$image" ] || continue
          repo=${image%%@*}; repo=${repo%:*}
          manifest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<<"$manifest")
          if [ "$SBOM" = true ]; then
            jq -r 'if .manifests then .manifests[] | select(.platform.os != "unknown") | .digest else .digest end' <<<"$manifest" |
            while read -r d; do
              syft "registry:$repo@$d" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"
              cosign attest --yes --type spdxjson --predicate "$RUNNER_TEMP/sbom.spdx.json" "$repo@$d"
              cosign verify-attestation --type spdxjson "${identity[@]}" "$repo@$d" >/dev/null
            done
          fi
          cosign sign --yes --recursive "$repo@$digest"
          cosign verify "${identity[@]}" "$repo@$digest" >/dev/null
        done <<<"$IMAGES"
