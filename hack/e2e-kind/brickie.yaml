apiVersion: v1
kind: Namespace
metadata:
  name: brickie
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brickie
  namespace: brickie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brickie
  namespace: brickie
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brickie
  namespace: brickie
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brickie
subjects:
  - kind: ServiceAccount
    name: brickie
    namespace: brickie
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brickie-runtimeclasses
rules:
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brickie-runtimeclasses
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brickie-runtimeclasses
subjects:
  - kind: ServiceAccount
    name: brickie
    namespace: brickie
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brickie
  namespace: brickie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: brickie
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brickie
    spec:
      serviceAccountName: brickie
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider
          image: brickie:e2e
          imagePullPolicy: Never
          env:
            - name: BRICKIE_DRIVER
              value: kubernetes
            - name: BRICKIE_SANDBOX_NAMESPACE
              value: brickie
            - name: BRICKIE_SANDBOX_RUNTIME
              value: none
            - name: BRICKIE_PROVIDER_IMAGE
              value: brickie:e2e
            - name: BRICKIE_WARM_REPLICAS
              value: "1"
            - name: BRICKIE_STORE
              value: file:///var/lib/brickie
          envFrom:
            - secretRef:
                name: brickie-hatchet
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: store
              mountPath: /var/lib/brickie
      volumes:
        - name: store
          emptyDir: {}
